[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omen-cli"
version = "0.2.0"
description = "A terminal-native security & developer toolkit"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = [
    "click>=8.0",
    "requests>=2.28",
]

[project.optional-dependencies]
config = ["PyYAML>=6.0"]

[project.scripts]
omen = "omen.cli:main"

[tool.setuptools.packages.find]
include = ["omen*"]
